services:
  - type: web
    name: mini-fleet-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start

  - type: web
    name: mini-fleet-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_WS_URL
        value: wss://mini-fleet-server.onrender.com
